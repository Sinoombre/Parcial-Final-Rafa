#cloud-config
# CaribeShop: arranque automatico de una aplicacion HTTP minima.

users:
    - default
    - name: caribeshop
      system: true
      lock_passwd: true
      shell: /usr/sbin/nologin

write_files:
    - path: /opt/caribeshop/app.py
      owner: root:root
      permissions: "0644"
      encoding: b64
      content: |
          ${app_b64}

    - path: /etc/systemd/system/caribeshop.service
      owner: root:root
      permissions: "0644"
      content: |
          [Unit]
          Description=CaribeShop demo HTTP
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=caribeshop
          Group=caribeshop
          WorkingDirectory=/opt/caribeshop
          Environment="KEY_VAULT_URI=${key_vault_uri}"
          Environment="KEY_VAULT_SECRET_NAME=${key_vault_secret_name}"
          ExecStart=/usr/bin/python3 /opt/caribeshop/app.py
          Restart=always
          RestartSec=3
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          CapabilityBoundingSet=CAP_NET_BIND_SERVICE
          NoNewPrivileges=true
          ProtectSystem=strict
          ProtectHome=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target

runcmd:
    - [mkdir, -p, /var/lib/caribeshop]
    - [systemctl, daemon-reload]
    - [systemctl, enable, --now, caribeshop.service]
