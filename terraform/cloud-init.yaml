#cloud-config
# CaribeShop: arranque automatico de una aplicacion HTTP minima.
# Sustituir esta aplicacion de demostracion por la aplicacion real del equipo.

users:
    - default
    - name: caribeshop
      system: true
      lock_passwd: true
      shell: /usr/sbin/nologin

write_files:
    - path: /opt/caribeshop/app.py
      owner: root:root
      permissions: "0644"
      content: |
            import json
            import socket
            import urllib.request
            from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
            from pathlib import Path
            from urllib.parse import urlsplit

            def get_zone():
                try:
                    request = urllib.request.Request(
                        "http://169.254.169.254/metadata/instance/compute/zone"
                        "?api-version=2021-02-01&format=text",
                        headers={"Metadata": "true"},
                    )
                    opener = urllib.request.build_opener(
                        urllib.request.ProxyHandler({})
                    )
                    with opener.open(request, timeout=2) as response:
                        return response.read().decode("utf-8").strip() or "unknown"
                except Exception:
                    return "unknown"

            FAILURE_FLAG = Path('/var/lib/caribeshop/unhealthy')
            HOSTNAME = socket.gethostname()
            ZONE = get_zone()

            class Handler(BaseHTTPRequestHandler):
                def do_GET(self):
                    path = urlsplit(self.path).path
                    if path == '/health':
                        healthy = not FAILURE_FLAG.exists()
                        status = 200 if healthy else 503
                        payload = {'status': 'ok' if healthy else 'unhealthy'}
                    elif path == '/':
                        status = 200
                        payload = {'service': 'CaribeShop', 'message': 'Demo HTTP activa', 'hostname': HOSTNAME, 'zone': ZONE}
                    else:
                        status = 404
                        payload = {'error': 'not found'}
                    body = json.dumps(payload).encode('utf-8')
                    self.send_response(status)
                    self.send_header('Content-Type', 'application/json; charset=utf-8')
                    self.send_header('Content-Length', str(len(body)))
                    self.end_headers()
                    self.wfile.write(body)

                def log_message(self, format, *args):
                    # Evita que cada sondeo de salud genere un log.
                    if urlsplit(self.path).path != '/health':
                        super().log_message(format, *args)
            
            class CaribeShopServer(ThreadingHTTPServer):    
                request_queue_size = 128

            if __name__ == '__main__':
                CaribeShopServer(('0.0.0.0', 80), Handler).serve_forever()

    - path: /etc/systemd/system/caribeshop.service
      owner: root:root
      permissions: "0644"
      content: |
          [Unit]
          Description=CaribeShop demo HTTP
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=caribeshop
          Group=caribeshop
          WorkingDirectory=/opt/caribeshop
          ExecStart=/usr/bin/python3 /opt/caribeshop/app.py
          Restart=always
          RestartSec=3
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          CapabilityBoundingSet=CAP_NET_BIND_SERVICE
          NoNewPrivileges=true
          ProtectSystem=strict
          ProtectHome=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target

runcmd:
    - [mkdir, -p, /var/lib/caribeshop]
    - [systemctl, daemon-reload]
    - [systemctl, enable, --now, caribeshop.service]